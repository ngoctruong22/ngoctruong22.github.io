on:
  push:
    workflows: [build-site, lab9-check]
    filter:
      branches: main

  pull_request:
    workflows: [lab9-check]

workflows:
  build-site:
    tasks:
      - name: build-and-publish-site
        cubes:
          - name: build-and-deploy
            image: docker.io/library/python:3.13-slim
            script:
              - apt-get update && apt-get install -y git
              - pip install -r requirements.txt
              - mkdocs build -f source/mkdocs.yml -d /tmp/site_build
              - git config user.email "ci@sourcecraft"
              - git config user.name "CI Bot"
              - git checkout release || git checkout -b release
              - rm -rf source/site
              - mkdir -p source/site
              - cp -r /tmp/site_build/* source/site/
              - git add -A source/site
              - git commit -m "Auto deploy MkDocs site" || echo "nothing to commit"
              - git push origin release -f

  lab9-check:
    tasks:
      - name: run-lab9-notebook-and-build-report
        cubes:
          - name: execute-lab9-notebook
            image: docker.io/library/python:3.11
            script:
              - pip install jupyter nbconvert pandas numpy matplotlib
              - jupyter nbconvert --to notebook --execute lab9/lab_template.ipynb --output executed_lab.ipynb --output-dir=.
              - jupyter nbconvert --to html executed_lab.ipynb --output report.html
            artifacts:
              paths:
                - executed_lab.ipynb
                - report.html